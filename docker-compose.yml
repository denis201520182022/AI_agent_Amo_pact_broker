version: '3.8'

services:
  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: ai_broker_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_broker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ai_broker_redis
    restart: always

  # FastAPI
  api:
    build: .
    container_name: ai_broker_api
    restart: always
    ports:
      - "8020:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./debug_logs:/app/debug_logs #
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started



  worker:
    build: .
    container_name: ai_broker_worker
    restart: always
    command: taskiq worker src.worker:broker --workers 1 --ack-type when_executed
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Telegram Bot 
  tg_bot:
    build: .
    container_name: ai_broker_tg
    restart: always
    command: python src/tg_worker.py
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Воркер напоминаний
  reminder_worker:
    build: .
    container_name: ai_broker_reminders
    restart: always
    command: python src/reminder_worker.py
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: